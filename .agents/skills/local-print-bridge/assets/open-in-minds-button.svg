<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 88" width="380" height="88" role="img" aria-label="Open in Minds">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B6BF6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
  </defs>
  <!-- button body -->
  <rect x="2" y="2" width="376" height="80" rx="20" fill="url(#g)"/>
  <rect x="2.5" y="2.5" width="375" height="79" rx="19.5" fill="none" stroke="#ffffff" stroke-opacity="0.18"/>
  <rect x="2" y="60" width="376" height="22" rx="20" fill="#000000" fill-opacity="0.10"/>

  <!-- label -->
  <text x="190" y="54" text-anchor="middle" dominant-baseline="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif"
        font-size="30" font-weight="700" fill="#ffffff" letter-spacing="0.3">Open in Minds</text>
