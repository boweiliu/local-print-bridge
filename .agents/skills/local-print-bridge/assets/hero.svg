<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" role="img" aria-label="A Minds chat sends a file that prints on a local printer">
  <rect x="0" y="0" width="600" height="240" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="24" y="34" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#1f2328">Minds prints — end to end</text>

  <!-- Minds chat card -->
  <g>
    <rect x="24" y="52" width="180" height="150" rx="12" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="48" cy="80" r="10" fill="#1f6feb"/>
    <rect x="66" y="72" width="110" height="9" rx="4.5" fill="#d8dee4"/>
    <rect x="66" y="88" width="80" height="9" rx="4.5" fill="#eaeef2"/>
    <rect x="40" y="116" width="148" height="9" rx="4.5" fill="#eaeef2"/>
    <rect x="40" y="132" width="120" height="9" rx="4.5" fill="#eaeef2"/>
    <rect x="40" y="164" width="148" height="26" rx="8" fill="#0969da"/>
    <text x="114" y="181" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#ffffff">Print test page</text>
  </g>

  <!-- arrow -->
  <g stroke="#57606a" stroke-width="2.5" fill="none">
    <path d="M212 127 H286" stroke-dasharray="6 6"/>
    <path d="M282 120 L292 127 L282 134" />
  </g>
  <text x="252" y="116" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="11" fill="#57606a">file bridge</text>

  <!-- printer + emerging sheet -->
  <g>
    <!-- printed sheet -->
    <rect x="392" y="40" width="150" height="120" rx="6" fill="#ffffff" stroke="#d0d7de"/>
    <text x="467" y="62" text-anchor="middle" font-family="-apple-system,Helvetica,Arial,sans-serif" font-size="9" font-weight="700" fill="#1f2328">MINDS TEST PAGE</text>
    <!-- grayscale ramp -->
    <g>
      <rect x="404" y="72" width="17" height="14" fill="#111111"/>
      <rect x="421" y="72" width="17" height="14" fill="#444444"/>
      <rect x="438" y="72" width="17" height="14" fill="#777777"/>
      <rect x="455" y="72" width="17" height="14" fill="#aaaaaa"/>
      <rect x="472" y="72" width="17" height="14" fill="#cccccc"/>
      <rect x="489" y="72" width="17" height="14" fill="#eeeeee" stroke="#e1e4e8"/>
      <rect x="506" y="72" width="18" height="14" fill="#ffffff" stroke="#e1e4e8"/>
    </g>
    <!-- color swatches -->
    <g>
      <rect x="404" y="92" width="17" height="14" fill="#00b3b3"/>
      <rect x="421" y="92" width="17" height="14" fill="#c800c8"/>
      <rect x="438" y="92" width="17" height="14" fill="#e6e600"/>
      <rect x="455" y="92" width="17" height="14" fill="#e00000"/>
      <rect x="472" y="92" width="17" height="14" fill="#00a000"/>
      <rect x="489" y="92" width="17" height="14" fill="#0000e0"/>
      <rect x="506" y="92" width="18" height="14" fill="#111111"/>
    </g>
    <rect x="404" y="116" width="120" height="6" rx="3" fill="#d8dee4"/>
    <rect x="404" y="128" width="96" height="6" rx="3" fill="#eaeef2"/>
    <!-- printer body -->
    <rect x="376" y="150" width="182" height="58" rx="10" fill="#eaeef2" stroke="#d0d7de"/>
    <rect x="392" y="176" width="150" height="26" rx="4" fill="#ffffff" stroke="#d0d7de"/>
    <circle cx="536" cy="166" r="5" fill="#1a7f37"/>
  </g>
</svg>
